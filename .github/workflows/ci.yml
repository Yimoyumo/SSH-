name: CI

on:
  push:
    branches: [master, windows-port, linux-port]
  pull_request:
    branches: [master, windows-port]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ssh-tool

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 安装 pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ssh-tool/frontend/pnpm-lock.yaml

      # WebKitGTK 4.1 开发包:Ubuntu 24.04 runner 只有 4.1,构建需 -tags webkit2_41
      - name: 安装 Linux 构建依赖(GTK3 / WebKitGTK 4.1 / CGO)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: 安装 Wails CLI v2.12.0
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # main.go embed frontend/dist,先构建前端再跑 go vet
      - name: 前端构建 (pnpm install + tsc + vite)
        working-directory: ssh-tool/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: go vet
        run: go vet ./...

      # 平台拆分后 Windows/Linux 两侧均原生编译,无需交叉编译
      - name: wails build (Windows)
        if: runner.os == 'Windows'
        run: wails build -s -skipbindings

      - name: wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -s -skipbindings -tags webkit2_41

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tool-${{ runner.os }}
          path: |
            ssh-tool/build/bin/ssh-tool.exe
            ssh-tool/build/bin/ssh-tool
          if-no-files-found: error
          retention-days: 14
